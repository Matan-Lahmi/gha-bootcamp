name: task2

on:
  push:
    branches:
      - main

jobs:
  job-a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with: 
          context: .
          push: false
          load: true
          tags: |
            myimage:${{ github.sha }}
            myimage:latest
      - run: echo "image-tag=${{ github.sha }}" > current-tag.txt
      - name: config git
        run: |
          git config user.name "Github Action Bot"
          git config user.email "actions@github.com"
      - name: commit and push
        run: |
          git add current-tag.txt
          git commit -m "image-tag [skip ci]"
          git push

