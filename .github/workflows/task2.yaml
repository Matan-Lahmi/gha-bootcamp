name: Concurrency Test

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate work
        run: |
          echo "Starting long task..."
          sleep 60
          echo "Finished task!"
