name: yamllint-test

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      - name: Install yamllint 
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: run yamllint
        run: yamllint apps/argocd-app.yaml
